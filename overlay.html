<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data: https: http:; style-src 'unsafe-inline'"
    />
    <title>lanpai overlay</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
        font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
      }

      .el {
        position: absolute;
        cursor: move;
        user-select: none;
        -webkit-user-drag: none;
      }

      .el:hover {
        outline: 1px dashed rgba(255, 255, 255, 0.6);
      }

      .el .content {
        display: block;
        pointer-events: none;
      }

      .el.text .content {
        color: #fff;
        white-space: pre-wrap;
        line-height: 1.3;
        text-shadow:
          0 0 4px rgba(0, 0, 0, 0.9),
          0 1px 2px rgba(0, 0, 0, 0.9);
      }

      .el .content[contenteditable='true'] {
        pointer-events: auto;
        cursor: text;
        user-select: text;
        outline: 1px solid rgba(120, 180, 255, 0.8);
      }

      .el img.content {
        width: 100%;
        height: auto;
        -webkit-user-drag: none;
      }

      .el.board {
        background: rgba(15, 15, 15, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 10px;
      }

      .board-title {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 9px 9px 0 0;
        font-weight: 700;
        cursor: move;
      }

      .board-fold {
        cursor: pointer;
        opacity: 0.75;
      }

      .board-fold:hover {
        opacity: 1;
      }

      .el.board.collapsed .board-items,
      .el.board.collapsed .handle {
        display: none;
      }

      .el.board.collapsed .board-title {
        border-radius: 9px;
      }

      .board-items {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 10px;
        min-height: 14px;
      }

      .item {
        cursor: move;
      }

      .item:hover {
        outline: 1px dashed rgba(255, 255, 255, 0.5);
      }

      .item.text .content {
        white-space: pre-wrap;
        line-height: 1.3;
      }

      .drop-line {
        position: absolute;
        left: 8px;
        right: 8px;
        height: 3px;
        border-radius: 2px;
        background: rgba(120, 180, 255, 0.95);
        pointer-events: none;
      }

      /* 多選:被選中的有實線藍框(跟 hover 的虛線區別開) */
      .el.selected {
        outline: 2px solid rgba(120, 180, 255, 0.95);
        outline-offset: 1px;
      }

      /* 選取組數字格:空的偏暗,存了東西的偏亮 */
      .slot-chip {
        width: 24px;
        height: 24px;
        padding: 0;
        font-size: 12px;
        font-weight: 700;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.15);
        cursor: pointer;
      }

      .slot-chip.filled {
        background: rgba(120, 180, 255, 0.85);
        color: #07101f;
        border-color: transparent;
      }

      .slot-chip:hover {
        outline: 1px solid rgba(120, 180, 255, 0.9);
      }

      .slot-hint {
        margin-top: 10px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        text-align: center;
      }

      #text-entry .slot-row {
        justify-content: center;
        margin-top: 6px;
      }

      /* 聚焦模式:只留被聚焦的那幾個,其他暫時藏起來 */
      body.spotlight .el:not(.spotlighted) {
        display: none;
      }

      .handle {
        position: absolute;
        right: -7px;
        bottom: -7px;
        width: 14px;
        height: 14px;
        border-radius: 3px;
        background: rgba(120, 180, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.9);
        cursor: nwse-resize;
        display: none;
      }

      .el:hover .handle {
        display: block;
      }

      #text-entry {
        position: absolute;
        left: 50%;
        top: 40%;
        transform: translate(-50%, -50%);
        display: none;
      }

      #toolbar {
        position: absolute;
        display: none;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        background: rgba(20, 20, 20, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        z-index: 9999;
      }

      .tb-row {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .tb-row:empty {
        display: none;
      }

      .swatch {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.5);
        padding: 0;
        cursor: pointer;
      }

      .tb-btn,
      .chip {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        padding: 3px 10px;
        font-size: 13px;
        cursor: pointer;
      }

      .chip {
        font-weight: 700;
        padding: 2px 8px;
        background: rgba(0, 0, 0, 0.6);
      }

      #tb-url {
        width: 240px;
        padding: 4px 8px;
        font-size: 13px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        outline: none;
      }

      .tb-btn:hover,
      .chip:hover,
      .swatch:hover {
        outline: 1px solid rgba(120, 180, 255, 0.9);
      }

      .tb-icon {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 24px;
        padding: 0;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        color: rgba(255, 255, 255, 0.85);
        cursor: pointer;
      }

      .tb-icon:hover {
        color: #ff6b6b;
        border-color: rgba(255, 107, 107, 0.85);
        background: rgba(255, 107, 107, 0.12);
      }

      #history-panel {
        position: absolute;
        left: 50%;
        top: 32%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 340px;
        padding: 16px 18px;
        background: rgba(20, 20, 20, 0.94);
        border: 1px solid rgba(120, 180, 255, 0.5);
        border-radius: 12px;
        z-index: 99999;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      }

      #history-panel .hp-title {
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }

      #history-panel .hp-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 45vh;
        overflow-y: auto;
      }

      #history-panel .hp-row {
        text-align: left;
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 7px;
        padding: 6px 10px;
        font-size: 13px;
        cursor: pointer;
      }

      #history-panel .hp-row:hover {
        outline: 1px solid rgba(120, 180, 255, 0.9);
      }

      #history-panel .hp-empty {
        color: rgba(255, 255, 255, 0.6);
        font-size: 13px;
        padding: 6px 2px;
      }

      #history-panel .hp-close {
        align-self: flex-end;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 7px;
        padding: 5px 14px;
        font-size: 13px;
        cursor: pointer;
      }

      #help-card {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 380px;
        padding: 22px 26px;
        background: rgba(20, 20, 20, 0.95);
        border: 1px solid rgba(120, 180, 255, 0.5);
        border-radius: 14px;
        z-index: 99999;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6);
        color: #fff;
      }

      #help-card .help-title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      #help-card .help-desc {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 16px;
      }

      #help-card .help-list {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      #help-card .help-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 13px;
      }

      #help-card .help-row kbd {
        flex-shrink: 0;
        min-width: 132px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-bottom-width: 2px;
        border-radius: 5px;
        padding: 2px 7px;
        font-family: 'SFMono-Regular', Consolas, monospace;
        font-size: 12px;
        color: #9ec5ff;
        text-align: center;
      }

      #help-card .help-row span {
        color: rgba(255, 255, 255, 0.85);
      }

      #help-card .help-foot {
        margin-top: 16px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        line-height: 1.5;
      }

      #help-card .help-btn {
        margin-top: 18px;
        width: 100%;
        background: rgba(120, 180, 255, 0.9);
        color: #07101f;
        border: none;
        border-radius: 8px;
        padding: 9px 0;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      #upgrade-card {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 320px;
        padding: 24px;
        border-radius: 14px;
        background: rgba(20, 24, 32, 0.97);
        border: 1px solid rgba(120, 180, 255, 0.6);
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
        color: #f2f3f5;
        font-family: system-ui, 'Microsoft JhengHei', sans-serif;
        z-index: 100000;
      }

      #upgrade-card .upgrade-title {
        font-size: 15px;
        color: #aab2bd;
      }

      #upgrade-card .upgrade-price {
        margin-top: 6px;
        font-size: 24px;
        font-weight: 700;
      }

      #upgrade-card .upgrade-list {
        margin: 14px 0 0;
        padding-left: 20px;
        font-size: 14px;
        line-height: 1.8;
      }

      #upgrade-card .upgrade-btn {
        margin-top: 18px;
        width: 100%;
        background: rgba(120, 180, 255, 0.9);
        color: #07101f;
        border: none;
        border-radius: 8px;
        padding: 10px 0;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }

      #upgrade-card .upgrade-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      #upgrade-card .upgrade-note {
        margin-top: 10px;
        min-height: 18px;
        font-size: 12px;
        color: #aab2bd;
        text-align: center;
      }

      #upgrade-card .upgrade-close {
        display: block;
        margin: 6px auto 0;
        background: none;
        border: none;
        color: #7d8590;
        font-size: 12px;
        cursor: pointer;
      }

      #help-card .help-btn:hover {
        background: rgba(150, 198, 255, 0.95);
      }

      #text-entry input {
        width: 420px;
        padding: 12px 16px;
        font-size: 22px;
        border: 1px solid rgba(120, 180, 255, 0.8);
        border-radius: 8px;
        background: rgba(20, 20, 20, 0.85);
        color: #fff;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="text-entry">
      <input type="text" placeholder="打字加文字、#標題 開板、貼網址加圖,Enter 確認,Esc 取消" />
    </div>
    <script src="limits.js"></script>
    <script src="wall.js"></script>
    <script src="toolbar.js"></script>
    <script src="board.js"></script>
    <script src="history.js"></script>
    <script src="groups.js"></script>
    <script src="onboarding.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
